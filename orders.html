<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEO Spritz · Bar View</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#161019;--ink-2:#1f1622;--plum:#2a1d31;--wine:#7a2f4a;
    --gold:#c9a24b;--gold-soft:#e0c584;--cream:#f3ece0;--cream-dim:#b8ae9e;
    --line:rgba(201,162,75,0.22);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:var(--ink);color:var(--cream);
    font-family:'Fraunces',Georgia,serif;-webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .mono{font-family:'JetBrains Mono',monospace}
  .wrap{max-width:760px;margin:0 auto;padding:3.5rem 1.6rem 5rem}

  /* gate */
  .gate{
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.6rem;
  }
  .gate-card{
    background:var(--ink-2);border:1px solid var(--line);border-radius:6px;
    padding:2.6rem;max-width:380px;width:100%;text-align:center;
  }
  .gate-card .eyebrow{
    font-family:'JetBrains Mono',monospace;font-size:.66rem;letter-spacing:.2em;
    text-transform:uppercase;color:var(--gold);margin-bottom:.9rem;
  }
  .gate-card h1{font-size:1.6rem;font-weight:500;margin-bottom:.4rem}
  .gate-card p{color:var(--cream-dim);font-size:.9rem;margin-bottom:1.6rem}
  input{
    width:100%;background:var(--ink);border:1px solid var(--line);color:var(--cream);
    font-family:'JetBrains Mono',monospace;font-size:1rem;letter-spacing:.15em;
    padding:.9rem 1rem;border-radius:3px;margin-bottom:1.1rem;text-align:center;
  }
  input:focus{outline:none;border-color:var(--gold)}
  .btn{
    font-family:'JetBrains Mono',monospace;font-size:.72rem;letter-spacing:.14em;
    text-transform:uppercase;color:var(--ink);background:var(--gold);border:none;
    padding:.9rem 1.4rem;border-radius:2px;cursor:pointer;width:100%;
    transition:background .2s ease;
  }
  .btn:hover{background:var(--gold-soft)}
  .err{color:var(--wine);font-family:'JetBrains Mono',monospace;font-size:.7rem;
    letter-spacing:.05em;min-height:1em;margin-top:.4rem}

  /* dashboard */
  .app{display:none}
  .app.show{display:block}
  header.bar{
    display:flex;justify-content:space-between;align-items:baseline;
    border-bottom:1px solid var(--line);padding-bottom:1.4rem;margin-bottom:2rem;
    flex-wrap:wrap;gap:.6rem;
  }
  header.bar h1{font-size:1.8rem;font-weight:500}
  header.bar .meta{
    font-family:'JetBrains Mono',monospace;font-size:.68rem;letter-spacing:.08em;
    color:var(--cream-dim);
  }
  header.bar .meta b{color:var(--gold-soft)}

  .totals{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
    gap:.8rem;margin-bottom:2.6rem;
  }
  .total-card{
    border:1px solid var(--line);border-radius:4px;padding:1rem;
  }
  .total-card .n{font-size:2rem;font-weight:500;color:var(--gold-soft);line-height:1}
  .total-card .lbl{
    font-family:'JetBrains Mono',monospace;font-size:.62rem;letter-spacing:.05em;
    color:var(--cream-dim);text-transform:uppercase;margin-top:.5rem;line-height:1.3;
  }

  .list-head{
    font-family:'JetBrains Mono',monospace;font-size:.66rem;letter-spacing:.2em;
    text-transform:uppercase;color:var(--gold);margin-bottom:1rem;
  }
  .order-row{
    display:grid;grid-template-columns:auto 1fr auto;gap:1rem;align-items:baseline;
    padding:.9rem 0;border-top:1px solid var(--line);
  }
  .order-row .idx{
    font-family:'JetBrains Mono',monospace;font-size:.7rem;color:var(--cream-dim);
  }
  .order-row .who{font-size:1.05rem}
  .order-row .what{color:var(--cream-dim);font-size:.9rem}
  .order-row .time{
    font-family:'JetBrains Mono',monospace;font-size:.66rem;color:var(--cream-dim);
    white-space:nowrap;
  }
  .empty{
    text-align:center;color:var(--cream-dim);padding:3rem 1rem;
    font-family:'JetBrains Mono',monospace;font-size:.8rem;letter-spacing:.05em;
  }
  .controls{
    display:flex;gap:.8rem;align-items:center;margin-top:2.4rem;
    font-family:'JetBrains Mono',monospace;font-size:.66rem;color:var(--cream-dim);
  }
  .controls button{
    background:none;border:1px solid var(--line);color:var(--cream-dim);
    font-family:'JetBrains Mono',monospace;font-size:.64rem;letter-spacing:.1em;
    text-transform:uppercase;padding:.6rem 1rem;border-radius:2px;cursor:pointer;
  }
  .controls button:hover{border-color:var(--gold);color:var(--cream)}
  a.back{color:var(--gold);text-decoration:none;font-family:'JetBrains Mono',monospace;
    font-size:.66rem;letter-spacing:.1em;text-transform:uppercase}

  @media (max-width:520px){
    .order-row{grid-template-columns:auto 1fr;row-gap:.2rem}
    .order-row .time{grid-column:2;text-align:left}
  }
</style>
</head>
<body>

<!-- PASSCODE GATE -->
<div class="gate" id="gate">
  <div class="gate-card">
    <div class="eyebrow">Bar View</div>
    <h1>Staff only</h1>
    <p>Enter the passcode to see the order list.</p>
    <input id="pass" type="password" placeholder="Passcode" autocomplete="off" aria-label="Passcode">
    <button class="btn" id="enterBtn">Unlock</button>
    <div class="err" id="err"></div>
  </div>
</div>

<!-- DASHBOARD -->
<div class="app" id="app">
  <div class="wrap">
    <header class="bar">
      <h1>Orders</h1>
      <div class="meta"><b id="totalCount">0</b> orders · <span id="updated">—</span></div>
    </header>

    <div class="totals" id="totals"></div>

    <div class="list-head">Order log · oldest first</div>
    <div id="list"></div>

    <div class="controls">
      <button id="refreshBtn">Refresh</button>
      <span>Auto-refreshes every 15s</span>
      <a class="back" href="/" style="margin-left:auto">← Menu</a>
    </div>
  </div>
</div>

<script>
// Passcode is client-side only: it keeps casual guests out, it is not real security.
const PASSCODE = "spritz";

const DRINK_NAMES = {
  "ai-perol":"AI-perol Spritz",
  "serp-spritz":"SERP Spritz",
  "pagespeed":"PageSpeed Prosecco",
  "nosecco":"404: Alcohol Not Found",
  "chicken-wine":"The Black-Hat Hatchling"
};

const gate=document.getElementById('gate');
const app=document.getElementById('app');
const pass=document.getElementById('pass');
const err=document.getElementById('err');

function unlock(){
  if(pass.value.trim().toLowerCase()===PASSCODE){
    sessionStorage.setItem('barUnlocked','1');
    gate.style.display='none';
    app.classList.add('show');
    startDashboard();
  }else{
    err.textContent='Wrong passcode';
    pass.value='';pass.focus();
  }
}
document.getElementById('enterBtn').addEventListener('click',unlock);
pass.addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});
if(sessionStorage.getItem('barUnlocked')==='1'){
  gate.style.display='none';app.classList.add('show');startDashboard();
}else{
  pass.focus();
}

let timer=null;
function startDashboard(){
  loadOrders();
  timer=setInterval(loadOrders,15000);
  document.getElementById('refreshBtn').addEventListener('click',loadOrders);
}

async function loadOrders(){
  let orders=[];
  try{
    const r=await fetch('/api/orders');
    if(r.ok){ orders=(await r.json()).orders||[]; }
  }catch(e){ /* leave empty */ }
  renderTotals(orders);
  renderList(orders);
  document.getElementById('totalCount').textContent=orders.length;
  document.getElementById('updated').textContent='updated '+new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
}

function renderTotals(orders){
  const counts={};
  Object.keys(DRINK_NAMES).forEach(id=>counts[id]=0);
  orders.forEach(o=>{ if(counts[o.drinkId]!==undefined)counts[o.drinkId]++; });
  document.getElementById('totals').innerHTML=Object.keys(DRINK_NAMES).map(id=>
    `<div class="total-card"><div class="n">${counts[id]}</div><div class="lbl">${DRINK_NAMES[id]}</div></div>`
  ).join('');
}

function renderList(orders){
  const list=document.getElementById('list');
  if(!orders.length){
    list.innerHTML='<div class="empty">No orders yet. They\'ll appear here as people order.</div>';
    return;
  }
  list.innerHTML=orders.map((o,i)=>{
    const t=new Date(o.at).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
    const name=(o.name||'Someone').replace(/</g,'&lt;');
    return `<div class="order-row">
      <div class="idx mono">${String(i+1).padStart(2,'0')}</div>
      <div><div class="who">${name}</div><div class="what">${o.drink||''}</div></div>
      <div class="time">${t}</div>
    </div>`;
  }).join('');
}
</script>
</body>
</html>
